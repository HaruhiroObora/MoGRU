# ==============================================================================
# Mozc GRU 言語モデル リライター 設定ファイル
# ==============================================================================
# このファイルの設定値を変更・保存すると、Fcitx5 や Mozc の再起動なしで
# 次の日本語変換から自動的に反映されます（ホットリロードおよびGUI設定画面と双方向同期）。
# ==============================================================================

# 【GRU ニューラル言語モデルリライターの有効化】 (初期値: true)
# - true: 有効, false: 無効（標準の Mozc と同じ変換挙動）
enable_gru_rewriter = true

# 【リアルタイム・ライブ変換の有効化】 (初期値: true)
# - 入力と同時にインラインで漢字かな交じり文へ自動変換します。
# - true: 有効, false: 無効（スペースキーで変換）
enable_live_conversion = true

# 【通常変換時（スペースキー等）の文節区切り「/」表示】 (初期値: false)
# - true: 変換中のプリエディットに文節区切り「/」を表示, false: 非表示
show_segment_separator_in_conversion = false

# 【ライブ変換時の文節区切り「/」表示】 (初期値: false)
# - true: ライブ変換中のプリエディットに文節区切り「/」を表示, false: 非表示
show_segment_separator_in_live_conversion = false

# 【ライブ変換時の前文節固定（計算量抑制）の有効化】 (初期値: true)
# - 指定文字数を超えた際に前半分程度の文節を固定（変換停止）し、計算量を抑制します。
# - true: 有効（固定文節とアクティブ文節の境界に「／」を表示）, false: 無効（常に全文変換）
enable_live_conversion_prefix_freezing = true

# 【ライブ変換時の自動確定（段階的確定）の有効化】 (初期値: false)
# - 前文節が固定された後、次のライブ変換更新タイミング（次のキー入力）で自動確定します。
# - true: 有効, false: 無効（Enterキーを押すまでPreedit内に保持）
enable_live_conversion_auto_commit = false

# 【ライブ変換の文節固定・自動確定トリガー文字数閾値】 (初期値: 24)
# - 確定平仮名キーの文字数がこの値以上になった際に前文節を固定します。
live_conversion_length_threshold = 24

# 【ベース言語モデルファイル (grumodel.bin) のパス】 (初期値: 空欄 = 標準パスを自動検出)
gru_model_path = 

# 【文字インデックス辞書 (chardata.bin) のパス】 (初期値: 空欄 = 標準パスを自動検出)
gru_chardata_path = 

# 【学習済みユーザーモデル (grumodel_user.bin) の保存先パス】 (初期値: 空欄 = 標準パスを自動検出)
gru_user_model_path = 

# 【GRU スコア重み係数 (Alpha)】 (初期値: 800.0)
# - Viterbi コストと GRU 対数尤度スコアを結合する重み係数です。
gru_score_weight = 800.0

# 【変換候補の説明欄への GRU スコア表示】 (初期値: true)
# - true: 候補リストに GRU スコア (GRU:...) を表示, false: 非表示
show_gru_score = true

# 【カタカナのみの候補に対するスコア乗数】 (初期値: 1.3)
# - GRU の対数尤度スコア（負値）に乗算されます。
# - 1.0 = 補正なし（素の言語モデルスコア）
# - 1.0 より大きい値（例: 1.3, 1.5）: コストが増加し、カタカナ候補が抑制されます。
#   確信度が高いカタカナ語（例:「ラーメン」）は抑制が小さく、不自然なカタカナ候補は強く抑制されます。
# - 1.0 より小さい値（例: 0.8）: コストが減少し、カタカナ候補が優先（ブースト）されます。
katakana_multiplier = 1.30

# 【平仮名のみの候補に対するスコア乗数】 (初期値: 1.1)
# - 漢字変換できる語で、ひらがなのまま確定するのを防ぎたい場合に有効です。
# - 1.0 = 補正なし
# - 1.0 より大きい値（例: 1.1, 1.3）: 平仮名候補が抑制されます。
# - 1文字の助詞（「は」「が」「を」等）は自動的にペナルティ0倍（補正なし）となります。
# - 2文字以上の語には、文字数に応じたスケーリングが適用されます。
hiragana_multiplier = 1.10

# 【平仮名ペナルティの文字数スケーリング指数】 (初期値: 1.0)
# - 文字数 L に応じて倍率をスケーリングする指数 p です。
# - 式: effective_multiplier = 1.0 + (hiragana_multiplier - 1.0) * (L - 1)^p
# - 1.0: 文字数に比例して線形に増加（2文字: 1.10, 3文字: 1.20, 4文字: 1.30, 6文字: 1.50）
# - 1.5 や 2.0: 長い平仮名ほど加速度的にペナルティを強化（4文字以上をより確実に漢字化）
# - 0.0: 文字数によらず一律 hiragana_multiplier を適用
hiragana_length_power = 1.00

# 【絵文字候補に対するペナルティ】 (初期値: 15000.0)
# - 文脈予測で絵文字が上位に割り込んでくるのを防ぐための固定加算コストです。
emoji_penalty = 15000.0

# 【英単語候補に対するスコア乗数】 (初期値: 2.0)
# - 「とうきょう」に「TOKYO」や「Tokyo」が誤って第1候補に昇格するのを防ぎます。
# - 負の対数尤度スコアを乗算（2.0 = コスト実質2倍加算）します。
alphabet_multiplier = 2.00

# 【文節区切り再編成（Resegmentation）の有効化】 (初期値: true)
# - GRU 言語モデルの文全体スコアを用いて、より自然な文節区切り位置へ自動変更します。
# - true: 有効, false: 無効（従来の Viterbi による固定区切りを使用）
enable_resegmentation = true

# 【文節区切りを変更するための最小コスト改善閾値】 (初期値: 600.0)
# - 別の文節区切りパターンのスコアが、デフォルトの区切りよりこの値以上改善した場合のみ区切りを変更します。
# - 値を小さくする（例: 300）と積極的に区切りを変更し、大きくする（例: 1000）と慎重になります。
resegment_threshold = 600.0

# 【入力履歴を用いたオンライン継続学習の有効化】 (初期値: true)
# - 変換確定時の文字列・文脈を用いて、GRU 言語モデルをリアルタイムに微調整します。
enable_online_learning = true

# 【オンライン学習の更新対象モード】 (初期値: output_only)
# - output_only: 出力層（w_out / b_out）のみを更新（高速・忘却が起きにくく安定）
# - full: Embedding・GRUセル・出力層の全パラメータをBPTTで更新（高い文脈適応力）
online_learning_mode = output_only

# 【オンライン学習の学習率】 (初期値: 0.005)
# - output_only モードでは 0.002〜0.01、full モードでは 0.0005〜0.002 程度を推奨します。
online_learning_rate = 0.00500

# 【ベースモデルへのL2アンカー正則化係数】 (初期値: 0.001)
# - 元の言語モデル（grumodel.bin）から重みが過度に乖離して一般的な日本語を忘却するのを防ぎます。
online_learning_weight_decay = 0.00100

# 【学習済みユーザーモデルの自動保存間隔（確定回数）】 (初期値: 5)
# - 指定した確定回数ごと、およびフォーカス移動時（Sync）に grumodel_user.bin へ保存します。
online_learning_save_interval = 5
