# ==============================================================================
# Mozc GRU 言語モデル リライター 設定ファイル
# ==============================================================================
# このファイルの設定値を変更・保存すると、Fcitx5 の再起動なしで
# 次の日本語変換から自動的に反映されます（ホットリロード対応）。
#
# コスト空間での加算ペナルティ設定（値が大きいほどその候補が出にくくなります）
# 通常の Viterbi コスト差は数百〜1000 程度です。
# ==============================================================================

# 【カタカナのみの候補に対するペナルティ】 (初期値: 500.0)
# - 「とうきょう」で「トウキョウ」より「東京」を優先させたい場合に有効です。
# - 注意: 値を大きくしすぎると、「ラーメン」「コンピュータ」などの本来カタカナが正解の単語まで
#   無理に漢字候補（例:「拉麺」など）へ化けてしまうため、300〜800 程度での微調整を推奨します。
katakana_penalty = 500.0

# 【平仮名のみの候補に対するペナルティ】 (初期値: 300.0)
# - 漢字変換できる語で、ひらがなのまま確定するのを防ぎたい場合に有効です。
# - 注意: 値を大きくしすぎると、助詞（「は」「が」「を」）やひらがな表記の言葉（「ありがとう」等）の
#   変換順位が下がってしまうため、100〜500 程度での微調整を推奨します。
hiragana_penalty = 300.0

# 【絵文字候補に対するペナルティ】 (初期値: 15000.0)
# - 文脈予測で絵文字が上位に割り込んでくるのを防ぎます。
emoji_penalty = 15000.0

# 【英単語候補に対するスコア乗数】 (初期値: 2.0)
# - 「とうきょう」に「TOKYO」や「Tokyo」が誤って第1候補に昇格するのを防ぎます。
# - 負の対数尤度スコアを乗算（2.0 = コスト実質2倍加算）します。
alphabet_multiplier = 2.0
