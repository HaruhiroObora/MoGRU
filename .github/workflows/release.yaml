name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libibus-1.0-dev qt6-base-dev fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --config release_build
          bazelisk build -c opt //unix/fcitx5:fcitx5-mogru.so //unix/fcitx5:fcitx5-mozc-gru.so //gui/tool:mozc_tool --//unix/fcitx5:use_server=False

      - name: Prepare MoGRU Linux Package
        run: |
          mkdir -p package_linux/icons/hicolor/128x128/apps
          mkdir -p package_linux/icons/hicolor/48x48/apps
          mkdir -p package_linux/icons/hicolor/32x32/apps
          mkdir -p package_linux/icons/mozc
          mkdir -p package_linux/models

          # 既存 package (旧 mozc.zip) の全成果物を展開
          unzip -q src/bazel-bin/unix/mozc.zip -d package_linux/

          # fcitx5-mogru.so を追加（ルート直下および usr/lib/fcitx5 配下）
          cp -f src/bazel-bin/unix/fcitx5/fcitx5-mogru.so package_linux/
          mkdir -p package_linux/usr/lib/fcitx5
          cp -f src/bazel-bin/unix/fcitx5/fcitx5-mogru.so package_linux/usr/lib/fcitx5/

          # mozc_tool をルート直下にコピー
          cp -f src/bazel-bin/gui/tool/mozc_tool package_linux/

          # モデルファイル
          cp -f models/*.bin package_linux/models/ 2>/dev/null || true
          cp -f models/*.ini package_linux/models/ 2>/dev/null || true

          # アイコンアセット（128x128）
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/hicolor/128x128/apps/fcitx_mozc.png
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/hicolor/128x128/apps/fcitx-mozc.png
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/hicolor/128x128/apps/fcitx_mogru.png
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/hicolor/128x128/apps/mogru.png

          # アイコンアセット（32x32）
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/fcitx_mozc.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/fcitx-mozc.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/fcitx_mogru.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/mogru.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/org.fcitx.Fcitx5.fcitx_mozc.png

          # アイコンアセット（48x48）
          for mode in direct hiragana katakana_full katakana_half alpha_full alpha_half; do
            if [ -f "src/data/images/unix/48x48/${mode}.png" ]; then
              cp -f "src/data/images/unix/48x48/${mode}.png" "package_linux/icons/hicolor/48x48/apps/fcitx_mozc_${mode}.png"
              cp -f "src/data/images/unix/48x48/${mode}.png" "package_linux/icons/hicolor/48x48/apps/fcitx_mogru_${mode}.png"
            fi
          done

          # ツールメニュー用アイコン（48x48）
          cp -f src/data/images/unix/ui-tool.png package_linux/icons/hicolor/48x48/apps/fcitx_mozc_tool.png
          cp -f src/data/images/unix/ui-properties.png package_linux/icons/hicolor/48x48/apps/fcitx_mozc_properties.png
          cp -f src/data/images/unix/ui-dictionary.png package_linux/icons/hicolor/48x48/apps/fcitx_mozc_dictionary.png

          # mozc 互換アイコン
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/mozc/product_icon_32bpp-128.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/mozc/ime_product_icon_opensource-32.png
          cp -f src/data/images/unix/ui-*.png package_linux/icons/mozc/ 2>/dev/null || true

          # スタンドアロンインストーラスクリプトの同梱
          cp -f scripts/install_linux.sh package_linux/install.sh
          chmod 755 package_linux/install.sh

          # zip アーカイブ作成
          mv package_linux MoGRU-linux
          zip -r MoGRU-linux.zip MoGRU-linux
          cp -f src/bazel-bin/unix/fcitx5/fcitx5-mogru.so fcitx5-mogru.so

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            MoGRU-linux.zip
            fcitx5-mogru.so
          if-no-files-found: error

  build_macos_arm64:
    name: Build macOS (ARM64)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try to restore update_deps cache
        uses: actions/cache@v4
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        run: |
          python3 build_tools/update_deps.py

      - name: Build Qt
        working-directory: ./src
        run: |
          python3 build_tools/build_qt.py --release --confirm_license --macos_cpus=arm64

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --macos_cpus=arm64 --config release_build

      - name: Prepare MoGRU macOS Package
        run: |
          mkdir -p package_mac/models
          cp -f src/bazel-bin/mac/*.pkg package_mac/
          cp -f scripts/install_macos.sh package_mac/install.sh
          chmod 755 package_mac/install.sh
          cp -f models/*.bin package_mac/models/ 2>/dev/null || true
          cp -f models/*.ini package_mac/models/ 2>/dev/null || true

          mv package_mac MoGRU-macOS-arm64
          zip -r MoGRU-macOS-arm64.zip MoGRU-macOS-arm64
          cp -f src/bazel-bin/mac/*.pkg MoGRU-macOS-arm64.pkg

      - name: Upload macOS ARM64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            MoGRU-macOS-arm64.zip
            MoGRU-macOS-arm64.pkg
          if-no-files-found: error

  build_windows_x64:
    name: Build Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try to restore update_deps cache
        uses: actions/cache@v4
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: bazel build
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build

      - name: Prepare MoGRU Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package_win\models -Force | Out-Null
          Copy-Item src\bazel-bin\win32\installer\*.msi package_win\ -Force
          Copy-Item scripts\install_windows.ps1 package_win\install.ps1 -Force
          Copy-Item -Path models\* -Destination package_win\models\ -Force -Recurse -ErrorAction SilentlyContinue

          Rename-Item package_win MoGRU-windows-x64
          Compress-Archive -Path MoGRU-windows-x64 -DestinationPath MoGRU-windows-x64.zip -Force
          Copy-Item src\bazel-bin\win32\installer\*.msi MoGRU-windows-x64.msi -Force

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            MoGRU-windows-x64.zip
            MoGRU-windows-x64.msi
          if-no-files-found: error

  build_windows_arm64:
    name: Build Windows (ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try to restore update_deps cache
        uses: actions/cache@v4
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: bazel build
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build

      - name: Prepare MoGRU Windows ARM64 Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package_win_arm64\models -Force | Out-Null
          Copy-Item src\bazel-bin\win32\installer\*.msi package_win_arm64\ -Force
          Copy-Item scripts\install_windows.ps1 package_win_arm64\install.ps1 -Force
          Copy-Item -Path models\* -Destination package_win_arm64\models\ -Force -Recurse -ErrorAction SilentlyContinue

          Rename-Item package_win_arm64 MoGRU-windows-arm64
          Compress-Archive -Path MoGRU-windows-arm64 -DestinationPath MoGRU-windows-arm64.zip -Force
          Copy-Item src\bazel-bin\win32\installer\*.msi MoGRU-windows-arm64.msi -Force

      - name: Upload Windows ARM64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-arm64
          path: |
            MoGRU-windows-arm64.zip
            MoGRU-windows-arm64.msi
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    needs:
      - build_linux
      - build_macos_arm64
      - build_windows_x64
      - build_windows_arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Display release assets
        run: |
          echo "=== Release assets to publish ==="
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          echo "Target Release Tag: $TAG"

          # 既存の Release が存在するか確認
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists. Uploading assets to existing release..."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new release for $TAG..."
            gh release create "$TAG" dist/* \
              --title "MoGRU $TAG" \
              --generate-notes
          fi
